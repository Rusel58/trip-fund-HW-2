name: Foundry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Check formatting
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vv
